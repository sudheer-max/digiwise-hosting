apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: digiwise-hosting
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: DigiWise Hosting Platform - Main Project
  sourceRepos:
    - 'https://github.com/anomalyco/digiwise-hosting.git'
  destinations:
    - namespace: digiwise-backend
      server: https://kubernetes.default.svc
    - namespace: digiwise-frontend
      server: https://kubernetes.default.svc
    - namespace: digiwise-databases
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
