apiVersion: v1
kind: Service
metadata:
  name: stalwart-smtp
  namespace: stalwart
  labels:
    app: stalwart
spec:
  type: NodePort
  selector:
    app: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: 25
      nodePort: 30025
    - name: submission
      port: 587
      targetPort: 587
      nodePort: 30587
    - name: smtps
      port: 465
      targetPort: 465
      nodePort: 30465
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-imap
  namespace: stalwart
  labels:
    app: stalwart
spec:
  type: NodePort
  selector:
    app: stalwart
  ports:
    - name: imap
      port: 143
      targetPort: 143
      nodePort: 30143
    - name: imaps
      port: 993
      targetPort: 993
      nodePort: 30993
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mgmt
  namespace: stalwart
  labels:
    app: stalwart
spec:
  type: ClusterIP
  selector:
    app: stalwart
  ports:
    - name: http
      port: 8080
      targetPort: 8080
