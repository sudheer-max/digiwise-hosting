apiVersion: apps/v1
kind: Deployment
metadata:
  name: digiwise-api
  labels:
    app: digiwise-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digiwise-api
  template:
    metadata:
      labels:
        app: digiwise-api
    spec:
      containers:
        - name: api
          image: harbor.digiwisesoftech.com/digiwise/digiwise-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: digiwise-api
spec:
  selector:
    app: digiwise-api
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digiwise-api-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: api.digiwisesoftech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digiwise-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.digiwisesoftech.com
      secretName: api-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: digiwise-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: digiwise-api
