apiVersion: apps/v1
kind: Deployment
metadata:
  name: digiwise-frontend
  labels:
    app: digiwise-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digiwise-frontend
  template:
    metadata:
      labels:
        app: digiwise-frontend
    spec:
      containers:
        - name: frontend
          image: harbor.digiwisesoftech.com/digiwise/digiwise-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: digiwise-frontend
spec:
  selector:
    app: digiwise-frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digiwise-frontend-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: digiwisesoftech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digiwise-frontend
                port:
                  number: 80
    - host: www.digiwisesoftech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digiwise-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - digiwisesoftech.com
        - www.digiwisesoftech.com
      secretName: frontend-tls
