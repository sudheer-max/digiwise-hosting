apiVersion: apps/v1
kind: Deployment
metadata:
  name: digiwise-frontend
  namespace: digiwise-frontend
  labels:
    app: digiwise-frontend
    managed-by: digiwise-hosting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digiwise-frontend
  template:
    metadata:
      labels:
        app: digiwise-frontend
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: frontend
          image: harbor.digiwisesoftech.com/digiwise/digiwise-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: https://api.digiwisesoftech.com
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: digiwise-frontend
  namespace: digiwise-frontend
  labels:
    app: digiwise-frontend
spec:
  selector:
    app: digiwise-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digiwise-frontend-ingress
  namespace: digiwise-frontend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: digiwisesoftech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digiwise-frontend
                port:
                  number: 80
    - host: www.digiwisesoftech.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digiwise-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - digiwisesoftech.com
        - www.digiwisesoftech.com
      secretName: frontend-tls
